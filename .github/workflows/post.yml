name: Post to Instagram
on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 20:00 Maldives time. GitHub may start a few minutes late.
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test the token only · dry-run = show what would be posted · post = really post"
        type: choice
        options: [check, dry-run, post]
        default: check
      day:
        description: "Day number (blank = today's day)"
        required: false
permissions:
  contents: write
concurrency: instagram-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/media
        run: |
          ARGS=""
          if [ -n "${{ inputs.day }}" ]; then ARGS="$ARGS --day ${{ inputs.day }}"; fi
          if [ "${{ inputs.mode }}" = "check" ]; then ARGS="--check"; fi
          if [ "${{ inputs.mode }}" = "dry-run" ]; then ARGS="$ARGS --dry-run"; fi
          python publish.py $ARGS
      - name: Save what was posted
        if: always()
        run: |
          git config user.name "leythikimv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Record posted day" && git push)
